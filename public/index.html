<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAIV Logo Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f4f1;
      color: #111;
    }

    main {
      width: min(92vw, 560px);
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.5;
    }

    form {
      border: 2px dashed #cfcfcf;
      padding: 24px;
      border-radius: 16px;
      background: #fafafa;
    }

    input {
      width: 100%;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>FAIV Logo Tool</h1>
    <p>Ladda upp en ZIP eller flera bilder. Verktyget lägger på FAIV och Lumen-loggorna och laddar ner en färdig ZIP.</p>

    <form id="uploadForm" action="/api/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="files" multiple required accept=".zip,image/jpeg,image/png,image/webp" />
      <button type="submit">Lägg på loggor och ladda ner ZIP</button>
      <div id="status"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('uploadForm');
    const button = form.querySelector('button');
    const status = document.getElementById('status');

    form.addEventListener('submit', () => {
      button.disabled = true;
      button.textContent = 'Bearbetar...';
      status.textContent = 'Din ZIP laddas ner automatiskt när bilderna är klara.';
    });
  </script>
</body>
</html>
