<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAIV Logo Tool</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:640px;margin:60px auto;padding:24px;">
  <h1>FAIV Logo Tool</h1>
  <p>Ladda upp en ZIP eller flera bilder. Verktyget lägger på FAIV och Lumen-loggorna och laddar ner en färdig ZIP.</p>
  <form action="/api/upload" method="post" enctype="multipart/form-data" style="border:2px dashed #ccc;border-radius:16px;padding:24px;">
    <input type="file" name="files" multiple required accept=".zip,image/jpeg,image/png,image/webp">
    <br><br>
    <button type="submit" style="padding:12px 18px;cursor:pointer;">Lägg på loggor och ladda ner ZIP</button>
  </form>
</body>
</html>
